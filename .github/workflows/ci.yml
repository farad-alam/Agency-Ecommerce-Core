name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Add any required env vars for build time here (e.g., skip db checks if possible, or provide test urls)
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          NEXTAUTH_SECRET: "ci_test_secret"
